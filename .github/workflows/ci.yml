name: CI — AI-SecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Unit Tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest boto3 fastapi uvicorn python-dotenv pydantic tenacity PyYAML

      - name: Run tests (no AWS credentials needed)
        run: pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    name: Lint

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Lint
        run: |
          flake8 src/ tests/ \
            --max-line-length=120 \
            --ignore=E501,W503,E226,E231 \
            --count --statistics

  security:
    runs-on: ubuntu-latest
    name: Security Scan

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          pip install bandit pip-audit detect-secrets

      - name: Bandit SAST
        run: bandit -r src/ --severity-level medium || true

      - name: Dependency audit
        run: pip-audit -r requirements.txt || true

      - name: Secret scanning
        run: detect-secrets scan --all-files || true
