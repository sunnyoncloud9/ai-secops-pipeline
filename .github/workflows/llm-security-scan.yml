name: 🛡️ AI Security Pipeline - OWASP LLM Top 10 Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Monday at 9am UTC (weekly security scan)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      system_prompt:
        description: 'Custom system prompt to test (optional)'
        required: false
        default: 'You are a helpful AI assistant.'
      model:
        description: 'Groq model to use'
        required: false
        default: 'llama3-8b-8192'

jobs:
  llm-security-scan:
    name: LLM Security Scan (OWASP LLM Top 10)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Static Analysis — Scan Code for Hardcoded Secrets
        run: |
          pip install detect-secrets
          detect-secrets scan --all-files > .secrets.baseline || true
          echo "Static secret scan complete."

      - name: 🔍 Static Analysis — Bandit Security Linting
        run: |
          pip install bandit
          bandit -r src/ -f json -o reports/bandit_report.json || true
          bandit -r src/ --severity-level medium || true

      - name: 🛡️ Run OWASP LLM Top 10 Security Scan
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          mkdir -p reports
          python main.py \
            --system-prompt "${{ github.event.inputs.system_prompt || 'You are a helpful AI assistant.' }}" \
            --model "${{ github.event.inputs.model || 'llama3-8b-8192' }}" \
            --output-dir reports
        continue-on-error: true  # Don't fail pipeline, capture results

      - name: 📊 Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-security-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30

      - name: 📋 Print Report Summary to Job Log
        if: always()
        run: |
          echo "===== LLM SECURITY SCAN RESULTS ====="
          if ls reports/*.md 1> /dev/null 2>&1; then
            cat reports/*.md
          else
            echo "No Markdown report found."
          fi

      - name: ✅ Check Scan Results — Fail on Critical/High
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -c "
          import json, glob, sys
          reports = glob.glob('reports/*.json')
          if not reports:
              print('No JSON report found.')
              sys.exit(0)
          with open(sorted(reports)[-1]) as f:
              report = json.load(f)
          summary = report.get('summary', {})
          severity = summary.get('severity_counts', {})
          critical = severity.get('CRITICAL', 0)
          high = severity.get('HIGH', 0)
          risk = summary.get('risk_level', 'UNKNOWN')
          print(f'Risk Level: {risk}')
          print(f'Critical: {critical}, High: {high}')
          if critical > 0 or high > 0:
              print('PIPELINE FAILED: Critical or High vulnerabilities detected.')
              sys.exit(1)
          print('PIPELINE PASSED: No critical/high vulnerabilities found.')
          "

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔍 Check Dependencies for Known Vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format json -o reports/pip_audit.json || true
          pip-audit -r requirements.txt || true

      - name: 📊 Upload Dependency Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-report-${{ github.run_number }}
          path: reports/pip_audit.json
          retention-days: 30
